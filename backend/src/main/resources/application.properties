# ReLife Application Configuration
# Use environment variables for DB credentials (cloud-ready)

spring.application.name=relife-backend

# MySQL Database - Use env vars for cloud migration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/relife_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root17}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Python matching service URL
relife.matching.service.url=${MATCHING_SERVICE_URL:http://localhost:5000}

# Server
server.port=8080

# CORS - Allow frontend
# Configured in WebConfig
